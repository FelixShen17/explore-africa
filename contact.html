<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Contact | 联系我们</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:"Poppins",sans-serif;
      background:#0f1115;
      color:#fff;
    }

    /* ================= HEADER ================= */
    header{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      padding:22px 60px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:10;
    }

    .logo{
      font-family:"Playfair Display",serif;
      font-size:20px;
      letter-spacing:3px;
    }

    nav a{
      margin-left:26px;
      text-decoration:none;
      color:#fff;
      font-size:13px;
      letter-spacing:2px;
    }

    /* ================= HERO ================= */
    .contact-hero{
      min-height:100vh;
      background:url("images/contact-bg.jpg") center/cover no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      padding:140px 24px 80px;
    }

    .contact-hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        rgba(0,0,0,.75)
      );
    }

   .contact-card{
  position:relative;
  z-index:1;
  max-width:820px;
  width:100%;
  padding:64px 72px;

  background: rgba(20,22,28,0.16);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  border-radius:28px;
  border:1px solid rgba(255,255,255,0.22);

  box-shadow:
    0 30px 70px rgba(0,0,0,.35),
    inset 0 0 0 1px rgba(255,255,255,.04);

  transition:
    transform .5s ease,
    box-shadow .5s ease;
  overflow:hidden;
}
/* 渐变光层 */
.contact-card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:inherit;

  background: linear-gradient(
    120deg,
    transparent 20%,
    rgba(255,165,0,0.35),
    rgba(255,200,120,0.45),
    rgba(255,165,0,0.35),
    transparent 80%
  );

  opacity:0;
  transition: opacity .6s ease;
  pointer-events:none;
}
.contact-card:hover{
  transform: translateY(-10px) scale(1.01);
  box-shadow:
    0 40px 90px rgba(0,0,0,.45),
    0 0 40px rgba(255,165,0,.35),
    inset 0 0 0 1px rgba(255,255,255,.06);
}

.contact-card:hover::before{
  opacity:1;
}

    .contact-card h1{
      font-family:"Playfair Display",serif;
      font-size:48px;
      margin-bottom:16px;
    }

    .contact-card p{
      font-size:16px;
      line-height:1.8;
      opacity:.9;
      margin-bottom:40px;
    }

    .contact-info{
      margin-bottom:50px;
      line-height:2;
      font-size:15px;
      opacity:.9;
    }

    /* ================= BUTTONS ================= */
    .contact-actions{
      display:flex;
      gap:28px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .contact-btn{
      position:relative;
      padding:18px 42px;
      border-radius:999px;
      font-size:13px;
      letter-spacing:3px;
      text-decoration:none;
      color:#fff;

      background:rgba(255,255,255,.08);
      backdrop-filter:blur(6px);

      border:1px solid rgba(255,255,255,.28);
      transition:.4s;
      overflow:hidden;
    }

    .contact-btn::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      opacity:0;
      transition:.4s;
    }

    .contact-btn.whatsapp::before{
      box-shadow:0 0 28px rgba(37,211,102,.9);
    }

    .contact-btn.email::before{
      box-shadow:0 0 28px rgba(255,165,0,.9);
    }

    .contact-btn:hover{
      transform:translateY(-4px);
    }

    .contact-btn:hover::before{
      opacity:1;
    }

    .contact-btn span{
      margin-right:10px;
      font-size:16px;
    }

    /* ================= MOBILE ================= */
    @media (max-width:768px){

      header{
        padding:20px 26px;
      }

      .contact-card{
        padding:48px 28px;
      }

      .contact-card h1{
        font-size:36px;
      }

      .contact-btn{
        width:100%;
        text-align:center;
        padding:18px 0;
      }
    }
/* ========================= */
/* MOBILE – CONTACT CARD ANIM */
/* ========================= */

@media (max-width: 768px) {

  .contact-card {
    opacity: 0;
    transform: translateY(40px) scale(0.98);
    transition:
      opacity 0.8s ease,
      transform 0.8s cubic-bezier(.2,.8,.2,1);
  }

  .contact-card.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

}

  </style>
</head>

<body>

<header>
  <div class="logo">EXPLORE AFRICA.</div>
  <nav>
    <a href="index.html">HOME</a>
    <a href="destination.html">DESTINATION</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<section class="contact-hero">

  <div class="contact-card">

    <h1>Contact Us<br>联系我们申总</h1>

    <p>
      Let’s plan your African journey together.<br>
      欢迎联系我们，定制属于你的非洲之旅。
    </p>

    <div class="contact-info">
      📍 Harare, Zimbabwe<br>
      🕘 Available 24/7 · 全时服务<br>
      🌍 Serving China & Africa
    </div>

    <div class="contact-actions">
<a
  href="https://api.whatsapp.com/send?phone=263776824295&text=Hello"
  target="_blank"
  rel="noopener"
  class="contact-btn whatsapp"
>
  <span>🟢</span>WhatsApp
</a>

      <!-- Email -->
      <a
        href="mailto:your@email.com"
        class="contact-btn email"
      >
        <span>✉️</span>Email
      </a>

    </div>

  </div>

</section>
<script>
  const contactCard = document.querySelector('.contact-card');

  if (contactCard) {
    const contactObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
        }
      });
    }, { threshold: 0.4 });

    contactObserver.observe(contactCard);
  }
</script>

</body>
</html>
