<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Contact | Explore Africa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:"Poppins",sans-serif;
      background:#0f1115;
      color:#fff;
    }

    a{color:inherit;text-decoration:none;}

    header{
      position:fixed;
      top:0;left:0;width:100%;
      padding:22px 60px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:10;
    }

    .logo{
      font-family:"Playfair Display",serif;
      font-size:22px;
      letter-spacing:2px;
    }

    nav a{
      margin-left:26px;
      font-size:13px;
      letter-spacing:2px;
    }

    .contact-hero{
      height:100vh;
      background:url("images/contact-bg.jpg") center/cover no-repeat;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      padding:0 20px;
    }

    .contact-hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.55);
      pointer-events: none;

    }

    .contact-card{
      position:relative;
      max-width:420px;
      width:100%;
      background:rgba(15,17,21,.75);
      backdrop-filter:blur(14px);
      border-radius:26px;
      padding:46px 36px;
      text-align:center;
      box-shadow:0 40px 80px rgba(0,0,0,.45);
    }

    .avatar{
      width:110px;
      height:110px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid rgba(255,255,255,.8);
      margin-bottom:18px;
    }

    h1{
      font-family:"Playfair Display",serif;
      font-size:26px;
      margin-bottom:6px;
    }

    .subtitle{
      font-size:14px;
      opacity:.75;
      margin-bottom:26px;
    }

    .contact-item{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:18px;
      font-size:15px;
      opacity:.9;
    }

    .btn-group{
      margin-top:28px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .btn{
      padding:14px;
      border-radius:30px;
      font-size:14px;
      letter-spacing:1px;
      transition:.3s;
      background:#fff;
      color:#000;
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 30px rgba(255,255,255,.25);
    }

    footer{
      text-align:center;
      padding:20px;
      font-size:12px;
      opacity:.5;
    }
    @media (max-width: 768px){
  .contact-hero{
    background-image:
      linear-gradient(
        to bottom,
        rgba(0,0,0,.25),
        rgba(0,0,0,.5)
      ),
      url("images/contact-bg-mobile.jpg");
  }
     .contact-card {
  background: rgba(20, 22, 28, 0.55);   /* 稍微更实一点 */
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.14);

  box-shadow:
    0 10px 34px rgba(0, 0, 0, 0.38),
    inset 0 0 0 1px rgba(255, 255, 255, 0.05);
}


}

  </style>
</head>

<body>

<header>
  <div class="logo">EXPLORE AFRICA.</div>
  <nav>
    <a href="index.html">HOME</a>
    <a href="destination.html">DESTINATION</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<div class="contact-hero">

  <div class="contact-card">

    <img src="images/avatar.jpg" class="avatar" alt="Felix">

    <h1>申寅琨 Felix</h1>
    <div class="subtitle">Private Africa Travel Consultant</div>

    <div class="contact-item">
      📞 +263 77267 7777
    </div>

    <div class="contact-item">
      💬 WeChat: ExploreAfrica_Tour
    </div>

    <div class="contact-item">
      📍 32 Borrowdale Brooke
    </div>

    <div class="btn-group">
      <!-- WhatsApp -->
      <a class="btn" href="https://wa.me/263772677777" target="_blank">
        Contact via WhatsApp
      </a>

      <!-- Email -->
      <a class="btn" href="mailto:yinkunshen17@gmail.com">
        Contact via Email
      </a>
    </div>

  </div>

</div>

<footer>
  © Explore Africa · Contact
</footer>

</body>
</html>
