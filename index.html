<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Explore Africa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #0f1115;
      color: #fff;
    }

    header {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 30px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 22px;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      margin-left: 30px;
      text-decoration: none;
      color: #fff;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .menu-toggle {
      display: none;
      font-size: 26px;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background:
        linear-gradient(
          rgba(15,17,21,0.6),
          rgba(15,17,21,0.9)
        ),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      padding: 0 80px;
    }

    .hero-content {
      max-width: 700px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 64px;
      margin-bottom: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.9;
      opacity: 0.9;
    }

    .cta-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 36px;
      border: 1px solid #fff;
      color: #fff;
      text-decoration: none;
      letter-spacing: 3px;
      font-size: 12px;
    }

    .cta-btn:hover {
      background: #fff;
      color: #000;
    }

    .cn {
      display: none;
    }

    /* 📱 Mobile */
   @media (max-width: 768px) {

  nav a {
    white-space: nowrap;
    font-size: 12px;
  }


      .menu-toggle {
        display: block;
      }

      nav {
        position: absolute;
        top: 80px;
        right: 30px;
        background: #0f1115;
        padding: 20px;
        display: none;
        flex-direction: column;
      }

      nav a {
        margin: 10px 0;
      }

      nav.show {
        display: flex;
      }

      .hero {
        padding: 0 30px;
      }

      h1 {
        font-size: 42px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">EXPLORE AFRICA.</div>

  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <nav id="nav-menu">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="destination.html">DESTINATION</a>
    <a href="contact.html">CONTACT</a>
    <a onclick="setLang('en')">EN</a>
    <a onclick="setLang('cn')">中文</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1 class="en">Explore Africa</h1>
    <h1 class="cn">探索非洲</h1>

    <p class="en">
      Tailor-made journeys across Africa.
      Nature, culture and unforgettable moments.
    </p>

    <p class="cn">
      为你量身定制非洲之旅，
      融合自然、文化与独一无二的体验。
    </p>

    <a href="contact.html" class="cta-btn">CONTACT US</a>
  </div>
</section>

<script>
  function toggleMenu() {
    document.getElementById("nav-menu").classList.toggle("show");
  }

  function setLang(lang) {
    document.querySelectorAll('.en').forEach(e => {
      e.style.display = lang === 'en' ? 'block' : 'none';
    });
    document.querySelectorAll('.cn').forEach(e => {
      e.style.display = lang === 'cn' ? 'block' : 'none';
    });
  }
</script>

</body>
</html>
